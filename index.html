<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Exam Generator</title>
    <style>
        /* --- GLOBAL RESETS & STYLING --- */
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f0f4f8; margin: 0; padding: 10px; color: #333; }

        /* --- CONTROL DASHBOARD CARD --- */
        .config-card {
            max-width: 600px; margin: 0 auto 15px auto; background: #ffffff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); border: 1px solid #e2e8f0;
        }
        .project-credit {
            background-color: #e6f6ff; border: 1px solid #bae3ff; border-radius: 8px; padding: 10px; text-align: center; color: #0066cc; font-weight: bold; font-size: 13px; margin-bottom: 12px;
        }
        .form-row { margin-bottom: 10px; }
        .form-row label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; color: #4a5568; }
        select {
            width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 13px; background: #fff; outline: none;
        }
        
        .flex-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .btn-lang { flex: 1; padding: 8px; border: 1px solid #cbd5e0; background: #fff; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-lang.active { background: #3182ce; color: white; border-color: #3182ce; }
        .btn-save { flex: 1; background: #28a745; color: white; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-load { flex: 1; background: #fd7e14; color: white; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        /* --- QUESTION TYPE PANEL GRID --- */
        .type-panel {
            max-width: 600px; margin: 0 auto 20px auto; background: #ffffff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); border: 1px solid #a0aec0;
        }
        .panel-title { font-size: 15px; font-weight: bold; border-bottom: 2px solid #4a5568; padding-bottom: 4px; margin-bottom: 10px; }
        .type-buttons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        
        .q-type-btn {
            padding: 8px; border: none; border-radius: 6px; color: white; font-weight: bold; font-size: 13px; cursor: pointer; text-align: left; padding-left: 12px;
        }
        .q-type-btn:hover { opacity: 0.9; }
        .btn-mcq    { background-color: #34495e; }
        .btn-tf     { background-color: #1abc9c; }
        .btn-blank  { background-color: #2980b9; }
        .btn-match  { background-color: #9b59b6; }
        .btn-define { background-color: #d35400; }
        .btn-image  { background-color: #c0392b; }
        .btn-diff   { background-color: #16a085; }
        .btn-reason { background-color: #2c3e50; }
        .btn-count  { background-color: #7f8c8d; }
        .btn-map    { background-color: #2ecc71; }
        .btn-open   { background-color: #9b59b6; }
        .btn-format { background-color: #1abc9c; }
        .btn-dict   { background-color: #2980b9; }
        .btn-write  { background-color: #e74c3c; }

        .btn-main-print {
            width: 100%; background-color: #f39c12; color: white; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 12px;
        }

        /* --- EXAM CANVAS LAYOUT --- */
        .exam-sheet { max-width: 850px; margin: 0 auto; background: white; padding: 30px; border: 1px solid #000; min-height: 1000px; }
        .exam-header { border: 1px solid #000; padding: 10px; margin-bottom: 15px; }
        .header-inputs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .header-cell { font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .paper-input { border: none; border-bottom: 1px dashed #777; outline: none; font-size: 14px; width: 100%; background: transparent; padding: 2px; }
        .paper-input:focus { background-color: #edf2f7; }

        /* --- INTERACTIVE SECTIONS AND BLOCKS --- */
        .questions-output { margin-top: 15px; }
        .section-wrapper { border: 1px dashed #cbd5e0; padding: 10px; margin-bottom: 15px; border-radius: 6px; background-color: #fcfcfc; position: relative; }
        .section-title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
        .section-title-input { font-weight: bold; font-size: 15px; color: #1a202c; border-bottom: 1px solid #cbd5e0; }
        
        .sub-questions-list { display: flex; flex-direction: column; gap: 6px; }
        .q-row { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
        .q-num { font-weight: bold; font-size: 14px; min-width: 20px; text-align: center; }
        
        /* Action Utility Items */
        .btn-section-add { background-color: #edf2f7; color: #2b6cb0; border: 1px solid #cbd5e0; padding: 3px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-section-add:hover { background-color: #e2e8f0; }
        .action-remove-block { background-color: #fff5f5; border: 1px solid #fed7d7; color: #e74c3c; font-size: 11px; cursor: pointer; font-weight: bold; padding: 3px 8px; border-radius: 4px; }
        .action-remove-block:hover { background-color: #e74c3c; color: white; }
        
        /* Inner Form Rows */
        .mcq-inline-row { display: flex; flex-wrap: wrap; gap: 15px; padding-left: 20px; margin-top: 2px; font-size: 14px; width: 100%; }
        .mcq-option-box { display: flex; align-items: center; gap: 3px; }
        .mcq-input-field { width: 110px; }
        
        .tf-inline-row { display: flex; gap: 20px; padding-left: 20px; margin-top: 2px; font-size: 14px; }
        .sa-compact-lines { height: 22px; border-left: 1px dashed #cbd5e0; margin: 4px 0 2px 20px; width: 100%; }

        /* --- MULTI-DIRECTION LAYOUT COUPLING --- */
        .rtl { direction: rtl; text-align: right; }
        .rtl .mcq-inline-row { padding-left: 0; padding-right: 20px; }
        .rtl .tf-inline-row { padding-left: 0; padding-right: 20px; }
        .rtl .sa-compact-lines { border-left: none; border-right: 1px dashed #cbd5e0; margin-left: 0; margin-right: 20px; }
        .rtl .action-remove-block { margin-left: 0; margin-right: auto; }

        /* --- CLEAN PRINT SYSTEM ENGINE --- */
        @media print {
            body { background: transparent; padding: 0; }
            .config-card, .type-panel, .btn-section-add, .action-remove-block, .action-item-delete { display: none !important; }
            .exam-sheet { border: none; padding: 0; max-width: 100%; box-shadow: none; }
            .section-wrapper { border: none; background: transparent; padding: 0; margin-bottom: 12px; }
            .section-title-input { border-bottom: none; }
            .paper-input { border-bottom: none; }
            input::placeholder { color: transparent; }
        }
    </style>
</head>
<body>

    <!-- Upper Control Configuration Station -->
    <div class="config-card">
        <div class="project-credit">🛠️ Interactive Multi-Type Layout Generator</div>
        
        <div class="form-row">
            <label>Select Font Family Style:</label>
            <select id="fontSelect" onchange="changePaperFont(this.value)">
                <option value="inherit">(KRG MOE) فۆنتی وەزارەتی پەروەردە</option>
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="'Segoe UI', sans-serif">Standard Clear Interface</option>
            </select>
        </div>

        <div class="flex-row">
            <button class="btn-lang" id="ln-ku" onclick="updateLanguageConfig('ku')">کوردی</button>
            <button class="btn-lang" id="ln-ar" onclick="updateLanguageConfig('ar')">عەرەبی</button>
            <button class="btn-lang active" id="ln-en" onclick="updateLanguageConfig('en')">English</button>
        </div>

        <div class="flex-row">
            <button class="btn-save" onclick="saveExamData()">💾 Save Setup</button>
            <button class="btn-load" onclick="loadExamData()">📂 Load Setup</button>
        </div>
    </div>

    <!-- Main Block Action Selection Deck -->
    <div class="type-panel">
        <div class="panel-title">Click to Add a New Question Section:</div>
        <div class="type-buttons-grid">
            <button class="q-type-btn btn-mcq" onclick="addNewSection('mcq', 'Q: Choose the correct answer (MCQ)')">➕ ١. MCQ</button>
            <button class="q-type-btn btn-tf" onclick="addNewSection('tf', 'Q: Write True or False (T/F)')">➕ ٢. T/F</button>
            <button class="q-type-btn btn-blank" onclick="addNewSection('blank', 'Q: Fill in the blanks with suitable words')">➕ ٣. Blank</button>
            <button class="q-type-btn btn-match" onclick="addNewSection('match', 'Q: Match the columns items together')">➕ ٤. Match</button>
            <button class="q-type-btn btn-define" onclick="addNewSection('define', 'Q: Define the following technical terms')">➕ ٥. Define</button>
            <button class="q-type-btn btn-image" onclick="addNewSection('image', 'Q: Look at the image and answer')">➕ ٦. Image</button>
            <button class="q-type-btn btn-diff" onclick="addNewSection('diff', 'Q: Differentiate between the options')">➕ ٧. Diff</button>
            <button class="q-type-btn btn-reason" onclick="addNewSection('reason', 'Q: Give clear structural reasons')">➕ ٨. Reasons</button>
            <button class="q-type-btn btn-count" onclick="addNewSection('count', 'Q: Count and write the details')">➕ ٩. Count</button>
            <button class="q-type-btn btn-map" onclick="addNewSection('map', 'Q: Identify marked sections on the map')">➕ ١٠. Map</button>
